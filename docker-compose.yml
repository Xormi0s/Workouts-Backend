services:
  mysql:
    image: mysql:8.4
    container_name: workouts-mysql
    restart: unless-stopped
    env_file:
      - database.env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: workouts-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  mysql-data: