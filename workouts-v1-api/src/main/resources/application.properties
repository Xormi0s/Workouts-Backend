spring.application.name=workouts

# DB Setup
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# JWT Setup
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Rate Limit Setup
rate-limit.login-capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
rate-limit.login-refill-period-seconds=${RATE_LIMIT_LOGIN_REFILL_PERIOD_SECONDS:60}
rate-limit.register-capacity=${RATE_LIMIT_REGISTER_CAPACITY:3}
rate-limit.register-refill-period-seconds=${RATE_LIMIT_REGISTER_REFILL_PERIOD_SECONDS:3600}

# Account Lockout Setup
account-lockout.max-attempts=${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
account-lockout.lockout-duration-minutes=${ACCOUNT_LOCKOUT_DURATION_MINUTES:15}